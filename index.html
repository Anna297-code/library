<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="stylesheet.css" />
    <script src="script.js" defer></script>
    <title>My Library</title>
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>My Library</h1>
        <p>Keep track of the books you've read and the ones still waiting.</p>
      </div>

      <button id="new-book-button" type="button">+ Add Book</button>
    </header>

    <main>
      <div id="container"></div>
    </main>

    <form id="form" class="hidden">
      <label for="title">Title: </label>
      <input type="text" id="title" required />

      <label for="author">Author: </label>
      <input type="text" id="author" required />

      <label for="pages">Pages: </label>
      <input type="number" id="pages" min="1" step="1" required />

      <label for="read-status">Have you read it? </label>
      <input type="checkbox" id="read-status" />

      <button type="submit">Submit</button>
      <button type="button" id="cancel-button">Cancel</button>
    </form>
  </body>
</html>
